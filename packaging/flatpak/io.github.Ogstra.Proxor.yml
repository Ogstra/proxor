app-id: io.github.Ogstra.Proxor
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
command: proxor
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
cleanup:
  - /bin/protoc*
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.a
  - /share/doc
modules:
  # org.kde.Sdk carries neither protobuf, yaml-cpp nor zxing-cpp, and the native
  # dependency script fetches them at build time. These are the same pinned
  # versions, resolved from immutable archives instead.
  - name: zxing-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_BLACKBOX_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/nu-book/zxing-cpp/archive/refs/tags/v2.0.0.tar.gz
        sha256: 12b76b7005c30d34265fc20356d340da179b0b4d43d2c1b35bcca86776069f76
  - name: yaml-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DYAML_CPP_BUILD_TESTS=OFF
      - -DYAML_CPP_BUILD_TOOLS=OFF
    sources:
      - type: archive
        url: https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-0.7.0.tar.gz
        sha256: 43e6a9fcb146ad871515f0d0873947e5d497a1c9c60c58cb102a97b47208b7c3
  - name: protobuf
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -Dprotobuf_BUILD_TESTS=OFF
      - -Dprotobuf_ABSL_PROVIDER=module
    sources:
      - type: archive
        url: https://github.com/protocolbuffers/protobuf/releases/download/v21.4/protobuf-all-21.4.tar.gz
        sha256: 6c5e1b0788afba4569aeebb2cfe205cb154aa01deacaba0cd26442f3b761a836
  - name: proxor
    buildsystem: simple
    build-commands:
      - test -f generated-go-sources.json
      - test -f .flatpak-input/proxor-source.tar.gz
      - tar -xzf .flatpak-input/proxor-source.tar.gz
      - source_root="$(find . -maxdepth 1 -type d -name 'proxor-*' -print -quit)"; test -n "$source_root"; cd "$source_root"; export GOPROXY=off GONOSUMDB='*' FLATPAK_ID=io.github.Ogstra.Proxor; ./packaging/flatpak/build-offline.sh "$PWD" /app
    sources:
      - type: file
        path: generated-go-sources.json
      - type: file
        path: .flatpak-input/proxor-source.tar.gz
        dest: .flatpak-input
      - type: dir
        path: .flatpak-input/geodata
        dest: .flatpak-input/geodata
      - type: dir
        path: .flatpak-input/go-cache
        dest: .flatpak-input/go-cache
      # org.kde.Sdk ships no Go, so the pinned release toolchain is an immutable
      # checksum-verified input like every other source in this manifest.
      - type: archive
        url: https://go.dev/dl/go1.26.1.linux-amd64.tar.gz
        sha256: 031f088e5d955bab8657ede27ad4e3bc5b7c1ba281f05f245bcc304f327c987a
        strip-components: 1
        dest: .flatpak-go-toolchain
