name: Validate published winget release

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: Previous public GitHub Release tag
        required: true
        type: string
      release_tag:
        description: Current public GitHub Release tag
        required: true
        type: string

jobs:
  validate-published-winget:
    runs-on: windows-latest
    environment: winget-publication
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install and upgrade only public release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./packaging/winget/test-published-winget.ps1 -PreviousTag '${{ inputs.previous_tag }}' -ReleaseTag '${{ inputs.release_tag }}' -Workspace "$env:RUNNER_TEMP/winget-publication"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-publication-report
          path: ${{ runner.temp }}/winget-publication/winget-publication-report.json
          if-no-files-found: error
